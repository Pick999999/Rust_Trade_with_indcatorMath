<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07090f;
            --surface: #0e1218;
            --border: #1e2530;
            --text: #c8d8f0;
            --text2: #6878a0;
            --accent: #7c6dfa;
            --red: #e8304a;
            --font: 'Kanit', 'Sarabun', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .login-container {
            background: var(--surface);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .login-header {
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            color: var(--text2);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text2);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 15px;
            font-family: var(--font);
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #6b5ce6;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .error-msg {
            color: var(--red);
            font-size: 14px;
            margin-top: 16px;
            display: none;
            background: rgba(232, 48, 74, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(232, 48, 74, 0.2);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1>ระบบจัดการ</h1>
            <p>กรุณาเข้าสู่ระบบเพื่อดำเนินการต่อ</p>
        </div>

        <form id="fakeLoginForm">
            <div class="input-group">
                <label for="username">ชื่อผู้ใช้ (Username)</label>
                <input type="text" id="username" required placeholder="admin">
            </div>
            
            <div class="input-group">
                <label for="password">รหัสผ่าน (Password)</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="login-btn">เข้าสู่ระบบ</button>
            
            <div id="errorMsg" class="error-msg">
                ❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง
            </div>
        </form>
    </div>

    <script>
        document.getElementById('fakeLoginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // ป้องกันการรีเฟรชหน้าเว็บ
            
            // ไม่มีการส่ง Request ใดๆ ไปยัง Backend
            // แสดงแค่ข้อความ Error หลอกๆ
            
            const btn = document.querySelector('.login-btn');
            btn.innerHTML = 'กำลังตรวจสอบ...';
            btn.style.opacity = '0.7';
            document.getElementById('errorMsg').style.display = 'none';

            // หน่วงเวลาจำลองการโหลด
            setTimeout(() => {
                btn.innerHTML = 'เข้าสู่ระบบ';
                btn.style.opacity = '1';
                document.getElementById('errorMsg').style.display = 'block';
                
                // สั่นกล่องข้อความเล็กน้อย
                const box = document.querySelector('.login-container');
                box.style.transform = 'translateX(5px)';
                setTimeout(() => box.style.transform = 'translateX(-5px)', 50);
                setTimeout(() => box.style.transform = 'translateX(5px)', 100);
                setTimeout(() => box.style.transform = 'translateX(0)', 150);
            }, 800);
        });
    </script>

</body>
</html>
