<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo Indicators - Trading System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            margin-bottom: 50px;
            font-size: 1.1rem;
        }

        .version {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px;
        }

        .trade-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 40px;
            border: none;
            border-radius: 15px;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .trade-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.5s ease;
        }

        .trade-button:hover::before {
            left: 100%;
        }

        .trade-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .trade-button:active {
            transform: translateY(-2px);
        }

        .short-term-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .long-term-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .icon {
            font-size: 1.8rem;
            margin-right: 15px;
        }

        .description {
            display: block;
            font-size: 0.9rem;
            font-weight: 400;
            opacity: 0.95;
            margin-top: 5px;
        }

        .button-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .footer {
            margin-top: 40px;
            color: #999;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 2rem;
            }

            .trade-button {
                padding: 20px 30px;
                font-size: 1.1rem;
            }

            .icon {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Turbo Indicators</h1>
        <p class="subtitle">ระบบเทรด Deriv อัตโนมัติ</p>
        <span class="version">Version 2.3 - OTP WebSocket</span>

        <div class="buttons-container">
            <a href="index_short_term.html" class="trade-button short-term-btn">
                <div class="button-content">
                    <div>
                        <span class="icon">⚡</span>
                        <span>Short Term Trade</span>
                    </div>
                    <span class="description">เทรดระยะสั้น - รวดเร็ว ตัดสินใจทันที</span>
                </div>
            </a>

            <a href="long_term_trade.html" class="trade-button long-term-btn">
                <div class="button-content">
                    <div>
                        <span class="icon">📊</span>
                        <span>Long Term Trade</span>
                    </div>
                    <span class="description">เทรดระยะยาว - วิเคราะห์เชิงลึก มั่นคง</span>
                </div>
            </a>
        </div>

        <div class="footer">
            <p>© 2026 Turbo Indicators - Powered by Rust & Deriv API</p>
        </div>
    </div>

    <script>
        // เพิ่ม animation เมื่อ hover
        document.querySelectorAll('.trade-button').forEach(button => {
            button.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-5px)';
            });
            
            button.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0)';
            });
        });

        // เพิ่ม loading effect เมื่อคลิก
        document.querySelectorAll('.trade-button').forEach(button => {
            button.addEventListener('click', function(e) {
                const buttonContent = this.querySelector('.button-content');
                buttonContent.style.opacity = '0.6';
                
                // แสดง loading icon
                const icon = this.querySelector('.icon');
                const originalIcon = icon.textContent;
                icon.textContent = '⏳';
                
                // Reset หลัง 500ms (ก่อนที่หน้าจะเปลี่ยน)
                setTimeout(() => {
                    icon.textContent = originalIcon;
                    buttonContent.style.opacity = '1';
                }, 500);
            });
        });

        // แสดง console message
        console.log('%c🚀 Turbo Indicators v2.3', 'color: #667eea; font-size: 20px; font-weight: bold;');
        console.log('%cPowered by Rust + Deriv API (OTP WebSocket)', 'color: #764ba2; font-size: 14px;');
        console.log('%c✅ Migration to OTP WebSocket Complete', 'color: #00f2fe; font-size: 12px;');
    </script>
</body>
</html>
