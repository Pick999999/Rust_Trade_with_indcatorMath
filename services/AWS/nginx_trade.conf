# ═══════════════════════════════════════════════════════════════
#  Nginx Config สำหรับ Turbo-Indicators Trading Server
#  รองรับ: HTTPS (SSL), WebSocket, Large JSON payload
# ═══════════════════════════════════════════════════════════════
#
#  วิธีใช้:
#  1. แก้ YOUR_DOMAIN เป็น domain จริง เช่น trade.example.com
#  2. Copy ไปวางที่ /etc/nginx/sites-available/trade
#  3. สร้าง symlink: sudo ln -sf /etc/nginx/sites-available/trade /etc/nginx/sites-enabled/trade
#  4. ลบ default ถ้ามี: sudo rm -f /etc/nginx/sites-enabled/default
#  5. Test: sudo nginx -t
#  6. Reload: sudo systemctl reload nginx
#
#  หากยังไม่มี SSL ให้ run:
#    sudo apt install certbot python3-certbot-nginx -y
#    sudo certbot --nginx -d YOUR_DOMAIN
# ═══════════════════════════════════════════════════════════════

# ── Upstream: ชี้ไปที่ Axum server (port 3000) ──────────────────
upstream axum_backend {
    server 127.0.0.1:3000;
}

# ── HTTP → HTTPS Redirect ────────────────────────────────────
server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$server_name$request_uri;
}

# ── HTTPS Server Block ───────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # ── SSL (จะถูก certbot แก้ไขอัตโนมัติ) ─────────────────
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Logging ──────────────────────────────────────────────
    access_log /var/log/nginx/trade_access.log;
    error_log  /var/log/nginx/trade_error.log;

    # ══════════════════════════════════════════════════════════
    #  ⚡ WebSocket: /ws path
    #  — ต้องมี Upgrade + Connection headers
    #  — timeout ยาวเพราะ WS ต้อง keep-alive ตลอดเทรด
    # ══════════════════════════════════════════════════════════
    location /ws {
        proxy_pass http://axum_backend;

        # ═══ สำคัญมาก! WebSocket Upgrade Headers ═══
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # ═══ Headers อื่นๆ ที่จำเป็น ═══
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ═══ Timeout — ตั้งยาว 24 ชม. สำหรับ WS ═══
        # WebSocket ต้อง keep-alive ตลอดที่เทรดอยู่
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # ═══ Buffer — ข้อมูล candles_history อาจใหญ่ 1-5 MB ═══
        proxy_buffering off;
        proxy_buffer_size 128k;
        proxy_buffers 8 128k;
    }

    # ══════════════════════════════════════════════════════════
    #  📡 API Routes: /api/*
    #  — HTTP ปกติ ไม่ต้อง WebSocket
    #  — แต่ response อาจใหญ่ (analysis data, history)
    # ══════════════════════════════════════════════════════════
    location /api/ {
        proxy_pass http://axum_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ═══ Timeout สำหรับ API ที่อาจใช้เวลานาน ═══
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # ═══ Buffer ใหญ่พอสำหรับ analysis response ═══
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;

        # ═══ รองรับ request body ใหญ่ (POST setup.json) ═══
        client_max_body_size 10m;
    }

    # ══════════════════════════════════════════════════════════
    #  📂 Static Files + Index (ทุก path อื่นๆ)
    # ══════════════════════════════════════════════════════════
    location / {
        proxy_pass http://axum_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ═══ Cache static assets ═══
        proxy_cache_valid 200 5m;
    }
}
